# Renovate läuft hier selbst: die gehostete Mend-App bricht bei diesem Repo an ihrer 3-GB-Speichergrenze ab.
# Einrichtung: eigene GitHub App (nur dieses Repo), Variable RENOVATE_APP_CLIENT_ID, Secret RENOVATE_APP_PRIVATE_KEY.
name: Renovate

on:
  schedule:
    - cron: '23 4 * * *' # täglich gegen 5–6 Uhr deutscher Zeit
  workflow_dispatch:
  # Kästchen im Dependency Dashboard angehakt → gleich laufen statt bis morgen warten
  issues:
    types: [edited]

# Renovate nutzt nur den App-Token, nicht den Standard-Token des Workflows
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Nur Änderungen des Inhabers starten einen Lauf; Renovates eigene Dashboard-Pflege sonst eine Endlosschleife
    if: >-
      github.repository == 'FloB95/qrcodly' &&
      (github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' && github.event.sender.login == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Fest auf Version + Prüfsumme; Renovate hebt das selbst an
          renovate-image: ghcr.io/renovatebot/renovate:44.239.1@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          # Commits über die GitHub-API: von GitHub signiert („Verified“)
          RENOVATE_PLATFORM_COMMIT: enabled
