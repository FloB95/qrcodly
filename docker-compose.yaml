services:
  db:
    container_name: qrcodly-db
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qrcodly
    command:
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-redo-log-capacity=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
    volumes:
      - database:/var/lib/mysql
    ports:
      - 3306:3306

  phpmyadmin:
    container_name: qrcodly-pma
    image: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    ports:
      - 8081:80

  redis:
    container_name: qrcodly-redis
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:latest
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami@umami_db:5432/umami
      APP_SECRET: replace-me-with-a-random-string
      DISABLE_BOT_CHECK: 'true'
    depends_on:
      umami_db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      # inside the container Umami listens on 3000; 3001 is only the port on the host
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 5
  umami_db:
    container_name: umami-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: qrcodly-minio
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: testtest
      MINIO_DEFAULT_BUCKETS: qrcodly
      MINIO_STORAGE_USE_HTTPS: 0
    volumes:
      - minio-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"

  minio-setup:
    container_name: qrcodly-minio-setup
    image: minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minio testtest) do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/qrcodly;
      /usr/bin/mc anonymous set download local/qrcodly;
      /usr/bin/mc mb --ignore-existing local/qrcodly-private;
      exit 0;
      "

  # Newsletter. Admin UI and API on http://localhost:9002 (9000 belongs to MinIO)
  listmonk:
    container_name: qrcodly-listmonk
    image: listmonk/listmonk:v6.2.0
    restart: always
    ports:
      - 9002:9000
    depends_on:
      listmonk-db:
        condition: service_healthy
    # empty --config: all settings come from the env below; install and upgrade are idempotent
    command:
      [
        sh,
        -c,
        "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''",
      ]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: listmonk
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: Europe/Berlin
      # super admin, only created on the very first start
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: listmonk-dev
  listmonk-db:
    container_name: qrcodly-listmonk-db
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: listmonk
    volumes:
      - listmonk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database:
  minio-data:
  umami-db-data:
  listmonk-db-data:
