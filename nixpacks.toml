# Nixpacks (Coolify) ships pnpm 9 as its newest nix package, but the workspace
# requires pnpm >= 11 (see engines/packageManager in package.json).
#
# pnpm is installed in the SETUP phase because Coolify force-overrides the
# install command via CLI flag (--install-cmd 'pnpm install'), which would
# discard any custom install cmds defined here. The standalone binary from
# get.pnpm.io is architecture-independent and needs no writable npm prefix.
# Keep the version in sync with "packageManager" in package.json.
providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_22', 'openssl', 'curl', 'wget']
cmds = [
	'curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.13.1 PNPM_HOME=/usr/local/share/pnpm SHELL=/bin/bash sh -',
	'ln -sf /usr/local/share/pnpm/pnpm /usr/local/bin/pnpm',
	'pnpm --version',
]
