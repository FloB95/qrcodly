# Nixpacks (Coolify) ships pnpm 9 as its newest nix package, but the workspace
# requires pnpm >= 11 (see engines/packageManager in package.json).
#
# - pnpm lives in the SETUP phase because Coolify force-overrides the install
#   command via CLI flag (--install-cmd), discarding custom install cmds.
# - The binary is fetched straight from GitHub releases. Do NOT use the
#   get.pnpm.io install script: it ends with `pnpm setup`, which pnpm 11
#   resolves to our root package.json script named "setup" and crashes.
# - libatomic1 is required by the standalone pnpm binary.
# Keep the version in sync with "packageManager" in package.json.
#
# Node.js comes from nodejs.org (checksum-verified), not from nix: the nix
# package lags behind security releases (nodejs_22 was stuck on 22.19.0).
# Keep the version in sync with NODE_IMAGE in apps/*/Dockerfile.
providers = ['node']

[phases.setup]
nixPkgs = ['openssl', 'curl', 'wget']
aptPkgs = ['curl', 'wget', 'libatomic1']
cmds = [
	'ARCH=$(uname -m) && case "$ARCH" in x86_64) NODE_ARCH=x64 NODE_SHA=eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c ;; aarch64|arm64) NODE_ARCH=arm64 NODE_SHA=33c37be234ba8bee041961047b19160f4d7d0f164e8e246f78bdd10feff148b3 ;; *) echo "unsupported arch: $ARCH" && exit 1 ;; esac && curl -fsSL -o /tmp/node.tar.gz "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-${NODE_ARCH}.tar.gz" && echo "${NODE_SHA}  /tmp/node.tar.gz" | sha256sum -c - && mkdir -p /usr/local/share/node && tar -xzf /tmp/node.tar.gz -C /usr/local/share/node --strip-components=1 && rm /tmp/node.tar.gz',
	'ARCH=$(uname -m) && case "$ARCH" in x86_64) PNPM_ARCH=x64 ;; aarch64|arm64) PNPM_ARCH=arm64 ;; *) echo "unsupported arch: $ARCH" && exit 1 ;; esac && mkdir -p /usr/local/share/pnpm && curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v11.13.1/pnpm-linux-${PNPM_ARCH}.tar.gz" | tar -xz -C /usr/local/share/pnpm',
	# /usr/bin, not /usr/local/bin: nixpacks runs every phase as a login shell
	# whose PATH does not include /usr/local/bin
	'for b in node npm npx; do ln -sf /usr/local/share/node/bin/$b /usr/bin/$b; done',
	'ln -sf /usr/local/share/pnpm/pnpm /usr/bin/pnpm',
	# Fail the build if another node (e.g. from nix) shadows the pinned one
	'test "$(node -v)" = v24.22.1 || { echo "expected node v24.22.1, got $(node -v) at $(command -v node)"; exit 1; }',
	'pnpm --version',
]
